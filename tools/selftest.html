<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Synaptask self-test</title>
<link rel="icon" href="../web/icons/icon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light dark; --bg: #f4f5f7; --fg: #1c1d21; --muted: #5d6270; --ok: #1d7a3e; --bad: #c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d1f23; --fg: #eceef0; --muted: #9aa0a9; --ok: #5bbf7a; --bad: #ff6b6b; } }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; }
  main { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 16px; }
  #summary { font-weight: 700; font-size: 16px; margin-bottom: 12px; }
  ol { padding-left: 22px; margin: 0; }
  li { padding: 2px 0; overflow-wrap: anywhere; }
  .ok { color: var(--ok); }
  .bad { color: var(--bad); font-weight: 600; }
  h2 { font-size: 15px; margin: 18px 0 6px; }
</style>
</head>
<body>
<main>
  <h1>Synaptask self-test</h1>
  <p>Serve the repository root (<code>python -m http.server</code> in the repo folder) and open <code>/tools/selftest.html</code>.
    Runs recurrence, the Work vault crypto and the local store in this browser. Uses its own storage namespace and cleans up.</p>
  <div id="summary">Running…</div>
  <div id="log"></div>
</main>
<script type="module" src="selftest.js"></script>
</body>
</html>
